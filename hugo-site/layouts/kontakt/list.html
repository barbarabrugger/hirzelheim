{{ define "main" }}

<!-- Page Header -->
<section class="bg-sage-50 py-12 md:py-16 border-b border-sage-100">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <h1 class="text-3xl md:text-4xl font-bold text-sage-800 mb-3">{{ .Title }}</h1>
    {{ with .Params.description }}
    <p class="text-lg text-gray-500 max-w-2xl">{{ . }}</p>
    {{ end }}
  </div>
</section>

<section class="py-12 md:py-16">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">

      <!-- Kontaktinformationen -->
      <div>
        <div class="prose prose-lg max-w-none prose-headings:text-sage-800 prose-p:text-gray-600 prose-a:text-sage-600">
          {{ .Content }}
        </div>
      </div>

      <!-- Kontaktformular + Karte -->
      <div class="space-y-8">
        <!-- Kontaktformular -->
        <div class="bg-white rounded-xl p-6 md:p-8 shadow-sm">
          <h2 class="text-xl font-semibold text-sage-800 mb-6">Nachricht senden</h2>
          <form action="https://formspree.io/f/placeholder" method="POST" class="space-y-4">
            <!-- PRÜFEN: Formspree oder anderes Formular-Backend einrichten -->
            <div>
              <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Name *</label>
              <input type="text" id="name" name="name" required
                     class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-sage-400 focus:border-sage-400 outline-none transition-colors">
            </div>
            <div>
              <label for="email" class="block text-sm font-medium text-gray-700 mb-1">E-Mail *</label>
              <input type="email" id="email" name="email" required
                     class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-sage-400 focus:border-sage-400 outline-none transition-colors">
            </div>
            <div>
              <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">Telefon</label>
              <input type="tel" id="phone" name="phone"
                     class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-sage-400 focus:border-sage-400 outline-none transition-colors">
            </div>
            <div>
              <label for="message" class="block text-sm font-medium text-gray-700 mb-1">Nachricht *</label>
              <textarea id="message" name="message" rows="5" required
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-sage-400 focus:border-sage-400 outline-none transition-colors resize-y"></textarea>
            </div>
            <button type="submit"
                    class="w-full px-6 py-3 bg-sage-400 text-white font-semibold rounded-lg hover:bg-sage-500 transition-colors">
              Nachricht senden
            </button>
            <p class="text-xs text-gray-400">* Pflichtfelder. Ihre Daten werden nur zur Bearbeitung Ihrer Anfrage verwendet.</p>
          </form>
        </div>

        <!-- Google Maps -->
        <div class="rounded-xl overflow-hidden shadow-sm aspect-video">
          <iframe
            src="{{ .Site.Params.mapsEmbed }}"
            width="100%" height="100%"
            style="border:0;"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
            title="Standort Stiftung Hirzelheim auf Google Maps">
          </iframe>
        </div>
      </div>

    </div>
  </div>
</section>

{{ end }}
