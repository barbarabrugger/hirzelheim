<header class="bg-white/95 backdrop-blur-sm shadow-sm sticky top-0 z-50" role="banner">
  <!-- Top Bar -->
  <div class="bg-gradient-to-r from-sun-400 via-ember-400 to-terra-400 text-white text-sm py-2">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center">
      <span class="hidden sm:inline text-white/90 italic">Ein Zuhause mit Herz und Geschichte — seit 1912</span>
      <a href="tel:{{ .Site.Params.phone }}" class="flex items-center gap-2 hover:text-white/80 font-medium" aria-label="Rufen Sie uns an: {{ .Site.Params.phone }}">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773a11.037 11.037 0 006.105 6.105l.774-1.548a1 1 0 011.059-.54l4.435.74a1 1 0 01.836.986V17a1 1 0 01-1 1h-2C7.82 18 2 12.18 2 5V3z"/>
        </svg>
        {{ .Site.Params.phone }}
      </a>
    </div>
  </div>

  <!-- Main Navigation -->
  <nav class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8" aria-label="Hauptnavigation">
    <div class="flex justify-between items-center h-20 md:h-24">
      <!-- Logo -->
      <a href="/" class="flex items-center gap-3 group" aria-label="Stiftung Hirzelheim — Zur Startseite">
        <img src="/images/logo.png" alt="Hirzelheim — Stiftung Hirzelheim Regensberg" class="h-10 md:h-14 w-auto">
      </a>

      <!-- Desktop Menu -->
      <div class="hidden lg:flex items-center gap-1">
        {{ range .Site.Menus.main }}
        {{ if ne .Name "Kontakt" }}
        <a href="{{ .URL }}" class="px-3 py-2 text-base text-gray-600 hover:text-ember-500 hover:bg-sun-50 rounded-md transition-colors{{ if $.IsMenuCurrent "main" . }} text-ember-500 font-medium{{ end }}">
          {{ .Name }}
        </a>
        {{ end }}
        {{ end }}
        <a href="/kontakt/" class="ml-4 px-5 py-2.5 bg-ember-400 text-white text-sm font-medium rounded-full hover:bg-ember-500 transition-colors shadow-sm">
          Kontakt aufnehmen
        </a>
      </div>

      <!-- Mobile Menu Button -->
      <button type="button" class="lg:hidden p-2 rounded-md text-gray-600 hover:bg-sun-50"
              aria-label="Menü öffnen" aria-expanded="false" aria-controls="mobile-menu"
              onclick="document.getElementById('mobile-menu').classList.toggle('hidden'); this.setAttribute('aria-expanded', this.getAttribute('aria-expanded') === 'true' ? 'false' : 'true')">
        <svg class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
    </div>

    <!-- Mobile Menu -->
    <div id="mobile-menu" class="hidden lg:hidden pb-6 border-t border-sun-100" role="navigation" aria-label="Mobile Navigation">
      <div class="pt-4 space-y-1">
        {{ range .Site.Menus.main }}
        <a href="{{ .URL }}" class="block px-4 py-3 text-lg text-gray-600 hover:text-ember-500 hover:bg-sun-50 rounded-lg">
          {{ .Name }}
        </a>
        {{ end }}
      </div>
      <div class="mt-4 px-4">
        <a href="tel:{{ .Site.Params.phone }}" class="flex items-center gap-2 text-ember-500 font-medium">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773a11.037 11.037 0 006.105 6.105l.774-1.548a1 1 0 011.059-.54l4.435.74a1 1 0 01.836.986V17a1 1 0 01-1 1h-2C7.82 18 2 12.18 2 5V3z"/>
          </svg>
          {{ .Site.Params.phone }}
        </a>
      </div>
    </div>
  </nav>
</header>
