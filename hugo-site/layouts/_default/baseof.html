<!DOCTYPE html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if not .IsHome }}{{ .Title }} | {{ end }}{{ .Site.Title }}</title>
  <meta name="description" content="{{ with .Params.description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">

  <!-- Favicon -->
  <link rel="icon" href="/images/logo.svg" type="image/svg+xml">

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            sage: {
              50: '#f6f8f4',
              100: '#e8efe4',
              200: '#d2dfcb',
              300: '#b0c9a4',
              400: '#8aad7a',
              500: '#6d9460',
              600: '#567a4b',
              700: '#45613d',
              800: '#3a5034',
              900: '#2f422c',
            },
            warm: {
              50: '#FBF9F4',
              100: '#f7f1e6',
              200: '#efe3cc',
              300: '#e2ceaa',
              400: '#d4b88a',
              500: '#c4a06a',
            },
            terracotta: {
              300: '#e8a88a',
              400: '#d4896a',
              500: '#c07050',
              600: '#a65a3c',
            },
          },
          fontFamily: {
            sans: ['Source Sans 3', 'system-ui', '-apple-system', 'sans-serif'],
            serif: ['Merriweather', 'Georgia', 'serif'],
          },
        },
      },
    }
  </script>

  <!-- Fonts: Source Sans 3 (body) + Merriweather (headings) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Custom Styles -->
  <style>
    body {
      font-family: 'Source Sans 3', system-ui, -apple-system, sans-serif;
      color: #3D3D3D;
      background-color: #FBF9F4;
    }
    h1, h2, h3 {
      font-family: 'Merriweather', Georgia, serif;
    }
    .skip-link {
      position: absolute;
      top: -100%;
      left: 0;
      background: #6d9460;
      color: white;
      padding: 0.5rem 1rem;
      z-index: 100;
      transition: top 0.2s;
    }
    .skip-link:focus {
      top: 0;
    }
    .card-hover {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .card-hover:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.08);
    }
    /* Weiche Wellentrenner */
    .wave-divider {
      position: relative;
    }
    .wave-divider::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 100%;
      height: 60px;
      background: currentColor;
      clip-path: ellipse(55% 100% at 50% 100%);
    }
    /* Warmer Zitat-Stil */
    blockquote {
      border-left: 4px solid #8aad7a;
      background: #f6f8f4;
      padding: 1.25rem 1.5rem;
      border-radius: 0 0.75rem 0.75rem 0;
      font-style: italic;
    }
    /* Prose Anpassungen */
    .prose h2, .prose h3 {
      font-family: 'Merriweather', Georgia, serif;
    }
    /* Decorative Leaf */
    .decorative-divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      color: #b0c9a4;
    }
    .decorative-divider::before,
    .decorative-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: currentColor;
    }
  </style>

  {{ block "head" . }}{{ end }}
</head>
<body class="min-h-screen flex flex-col bg-warm-50">

  <!-- Skip Navigation -->
  <a href="#main-content" class="skip-link">Zum Hauptinhalt springen</a>

  {{ partial "header.html" . }}

  <main id="main-content" class="flex-grow" role="main">
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}

  {{ block "scripts" . }}{{ end }}
</body>
</html>
