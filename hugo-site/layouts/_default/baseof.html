<!DOCTYPE html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if not .IsHome }}{{ .Title }} | {{ end }}{{ .Site.Title }}</title>
  <meta name="description" content="{{ with .Params.description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">

  <!-- Favicon -->
  <link rel="icon" href="/images/logo.png" type="image/png">

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            /* Aus dem Logo abgeleitet: Gold → Orange → Terracotta */
            sun: {
              50: '#fef9f0',
              100: '#fdf0db',
              200: '#fbe0b5',
              300: '#f6c96e',
              400: '#e8a838',  /* Logo-Gold */
              500: '#d99220',
              600: '#c07818',
              700: '#9a5c15',
              800: '#7d4a18',
              900: '#68401a',
            },
            ember: {
              50: '#fef5f0',
              100: '#fde8db',
              200: '#facdb5',
              300: '#f5a878',
              400: '#e87830',  /* Logo-Orange */
              500: '#d46020',
              600: '#c04818',
              700: '#9a3815',
              800: '#7d3018',
              900: '#682c1a',
            },
            terra: {
              50: '#fdf3f0',
              100: '#fce4db',
              200: '#f8c5b5',
              300: '#f0a088',
              400: '#d05028',  /* Logo-Rot-Orange */
              500: '#b84020',
              600: '#a03518',
              700: '#802c15',
              800: '#682818',
              900: '#58241a',
            },
            /* Natur-Grün als Komplementärfarbe */
            nature: {
              50: '#f4f7f2',
              100: '#e6ede2',
              200: '#cddbc5',
              300: '#a8c29c',
              400: '#7c9e6e',
              500: '#5f8252',
              600: '#4a6840',
              700: '#3c5435',
              800: '#33452e',
              900: '#2b3a27',
            },
            warm: {
              50: '#FFFCF7',
              100: '#FFF7EC',
              200: '#FFEFD6',
              300: '#FFE4B8',
              400: '#e8cfa0',
              500: '#d4b888',
            },
          },
          fontFamily: {
            sans: ['Source Sans 3', 'system-ui', '-apple-system', 'sans-serif'],
            serif: ['Merriweather', 'Georgia', 'serif'],
          },
        },
      },
    }
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Custom Styles -->
  <style>
    body {
      font-family: 'Source Sans 3', system-ui, -apple-system, sans-serif;
      color: #3D3D3D;
      background-color: #FFFCF7;
    }
    h1, h2, h3 {
      font-family: 'Merriweather', Georgia, serif;
    }
    .skip-link {
      position: absolute;
      top: -100%;
      left: 0;
      background: #e87830;
      color: white;
      padding: 0.5rem 1rem;
      z-index: 100;
      transition: top 0.2s;
    }
    .skip-link:focus {
      top: 0;
    }
    .card-hover {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .card-hover:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.08);
    }
    blockquote {
      border-left: 4px solid #e8a838;
      background: #fef9f0;
      padding: 1.25rem 1.5rem;
      border-radius: 0 0.75rem 0.75rem 0;
      font-style: italic;
    }
    .prose h2, .prose h3 {
      font-family: 'Merriweather', Georgia, serif;
    }
    .decorative-divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      color: #e8a838;
    }
    .decorative-divider::before,
    .decorative-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: currentColor;
      opacity: 0.5;
    }
    /* Logo-Gradient für Akzente */
    .logo-gradient {
      background: linear-gradient(135deg, #e8a838, #e87830, #d05028);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
  </style>

  {{ block "head" . }}{{ end }}
</head>
<body class="min-h-screen flex flex-col bg-warm-50">

  <!-- Skip Navigation -->
  <a href="#main-content" class="skip-link">Zum Hauptinhalt springen</a>

  {{ partial "header.html" . }}

  <main id="main-content" class="flex-grow" role="main">
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}

  {{ block "scripts" . }}{{ end }}
</body>
</html>
